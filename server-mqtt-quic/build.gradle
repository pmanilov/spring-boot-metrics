plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.manilov'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation project(':common')

    // Netty MQTT codec + Netty QUIC (incubator, quiche backed).
    // netty-codec-mqtt, netty-handler, netty-transport etc. come transitively
    // from the QUIC incubator artifact; their versions are aligned by Spring
    // Boot's dependency management (we intentionally do not pull in netty-all
    // to avoid mixing uber-jar classes with the newer individual netty jars).
    implementation 'io.netty:netty-codec-mqtt'
    implementation 'io.netty.incubator:netty-incubator-codec-classes-quic:0.0.72.Final'
    // BouncyCastle is required by Netty's SelfSignedCertificate on JDK 17+
    // (the OpenJDK sun.security.x509 fallback no longer works on Java 21).
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:linux-x86_64'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:linux-aarch_64'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:osx-x86_64'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:osx-aarch_64'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
