plugins {
    id 'java-library'
}

group = 'com.manilov.common'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = '21'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter:3.5.5'
    api 'org.springframework.boot:spring-boot-starter-jdbc:3.5.5'
    api 'com.clickhouse:jdbc-v2:0.9.2'
    api 'org.lz4:lz4-java:1.8.0'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

}