plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.manilov'
version = '1.2'

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.manilov.ConfigUI'
        )
    }
}

dependencies {
    implementation name: 'mqtt_udp-0.5.2'
    implementation group: 'org.eclipse.paho', name: 'org.eclipse.paho.client.mqttv3', version: '1.2.5'
    implementation('org.controlsfx:controlsfx:11.1.2')

    // Netty QUIC client (incubator) for MQTT-over-QUIC transport
    implementation 'io.netty:netty-all:4.1.121.Final'
    implementation 'io.netty.incubator:netty-incubator-codec-classes-quic:0.0.72.Final'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:linux-x86_64'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:linux-aarch_64'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:osx-x86_64'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:osx-aarch_64'

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml']
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainModule = 'com.manilov'
    mainClass = 'com.manilov.ConfigUI'
}

def javafxPath = System.getProperty('user.home') + '/javafx/javafx-sdk-21.0.8/lib'

task runWithJavaFX(type: JavaExec) {
    group = "Execution"
    description = "Run the main class with JavaFX module path"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass

    jvmArgs = [
            "--module-path", javafxPath,
            "--add-modules", "javafx.controls,javafx.fxml"
    ]
}

task checkJavaFX {
    doFirst {
        def javafxDir = new File(javafxPath)
        if (!javafxDir.exists()) {
            throw new GradleException("JavaFX SDK not found at: ${javafxPath}\n" +
                    "Please download from https://gluonhq.com/products/javafx/ and extract to ~/javafx/")
        }
        println "JavaFX found at: ${javafxPath}"
    }
}

task experimentJar(type: Jar) {
    archiveBaseName = 'experiment-runner'

    manifest {
        attributes(
                'Main-Class': 'com.manilov.ExperimentRunner'
        )
    }

    from sourceSets.main.output

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

task experimentPacketSizeJar(type: Jar) {
    archiveBaseName = 'experiment-packet-size'

    manifest {
        attributes(
                'Main-Class': 'com.manilov.PacketSizeExperimentRunner'
        )
    }

    from sourceSets.main.output

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

task experimentPacketLossJar(type: Jar) {
    archiveBaseName = 'experiment-packet-loss'

    manifest {
        attributes(
                'Main-Class': 'com.manilov.PacketLossExperimentRunner'
        )
    }

    from sourceSets.main.output

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

task experimentPacketLossQos1Jar(type: Jar) {
    archiveBaseName = 'experiment-packet-loss-qos1'

    manifest {
        attributes(
                'Main-Class': 'com.manilov.QosPacketLossExperimentRunner'
        )
    }

    from sourceSets.main.output

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
