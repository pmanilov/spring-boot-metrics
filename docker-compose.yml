services:
  metrics-server-mqtt:
    build:
      context: .
      dockerfile: mqtt.Dockerfile
    mem_limit: 1100m
    memswap_limit: 1100m
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx896m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
    ports:
      - "8081:8081"
    networks:
      - mqtt
    depends_on:
      - emqx
    cap_add:
      - NET_ADMIN

#  metrics-server-mqtt-udp:
#    build:
#      context: .
#      dockerfile: mqtt-udp.Dockerfile
#    ports:
#      - "8082:8082"
#      - "1883:1883/udp"
#    cap_add:
#      - NET_ADMIN
#    networks:
#      - mqtt

  emqx:
    image: emqx/emqx:5.8.0
    mem_limit: 2300m
    memswap_limit: 2300m
    restart: unless-stopped
    sysctls:
      - net.core.rmem_max=33554432
      - net.core.wmem_max=33554432
    ports:
      - "1883:1883"
      - "14567:14567/udp"
      - "18083:18083"
    environment:
      - EMQX_LISTENERS__QUIC__DEFAULT__ENABLED=true
      - EMQX_LISTENERS__QUIC__DEFAULT__BIND=0.0.0.0:14567
      - EMQX_LISTENERS__QUIC__DEFAULT__MAX_CONNECTIONS=10000
      - EMQX_LISTENERS__QUIC__DEFAULT__ACCEPTORS=16
      - EMQX_LISTENERS__QUIC__DEFAULT__IDLE_TIMEOUT=300s
      - EMQX_LISTENERS__QUIC__DEFAULT__KEEP_ALIVE_INTERVAL=120s
      # QUIC flow control / streams per session — оставлены под значениями из msquic,
      # которые EMQX 5.8 пробрасывает: см. listeners.quic.default в emqx.conf.
      # При необходимости поднимать через хот-config или extra env.
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_MQTT__MAX_INFLIGHT=1024
      - EMQX_MQTT__MAX_MQUEUE_LEN=80000
      - EMQX_MQTT__MQUEUE_STORE_QOS0=false
      - EMQX_FORCE_SHUTDOWN__ENABLE=true
      - EMQX_FORCE_SHUTDOWN__MAX_MAILBOX_SIZE=200000
      - EMQX_FORCE_SHUTDOWN__MAX_HEAP_SIZE=1536MB
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - mqtt
    cap_add:
      - NET_ADMIN

  metrics-server-mqtt-quic:
    build:
      context: .
      dockerfile: quic.Dockerfile
    mem_limit: 2200m
    memswap_limit: 2200m
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx768m -XX:MaxDirectMemorySize=1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      - MQTTQUIC_STREAM_POOL_SIZE=4
    ports:
      - "8083:8083"
    cap_add:
      - NET_ADMIN
    networks:
      - mqtt
    depends_on:
      - emqx

  clickhouse:
    profiles:
      - storage
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_config/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./clickhouse_config/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./clickhouse_init:/docker-entrypoint-initdb.d
    networks:
      - mqtt

networks:
  mqtt:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
