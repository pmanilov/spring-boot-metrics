services:
  metrics-server-mqtt:
    build:
      context: .
      dockerfile: mqtt.Dockerfile
    mem_limit: 1100m
    memswap_limit: 1100m
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx896m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
    ports:
      - "8081:8081"
    networks:
      - mqtt
    depends_on:
      - emqx
    cap_add:
      - NET_ADMIN

#  metrics-server-mqtt-udp:
#    build:
#      context: .
#      dockerfile: mqtt-udp.Dockerfile
#    ports:
#      - "8082:8082"
#      - "1883:1883/udp"
#    cap_add:
#      - NET_ADMIN
#    networks:
#      - mqtt

  emqx:
    image: emqx/emqx:5.8.0
    mem_limit: 2700m
    memswap_limit: 2700m
    restart: unless-stopped
    # Замечание: net.core.rmem_max / net.core.wmem_max не namespaced и через
    # sysctls контейнера не задаются (Docker ругнётся «unsafe procfs detected»).
    # Поднимите их на хосте — см. raise_udp_buffers.sh в корне репозитория.
    ports:
      - "1883:1883"
      - "14567:14567/udp"
      - "18083:18083"
    environment:
      - EMQX_LISTENERS__QUIC__DEFAULT__ENABLED=true
      - EMQX_LISTENERS__QUIC__DEFAULT__BIND=0.0.0.0:14567
      - EMQX_LISTENERS__QUIC__DEFAULT__MAX_CONNECTIONS=10000
      - EMQX_LISTENERS__QUIC__DEFAULT__ACCEPTORS=16
      - EMQX_LISTENERS__QUIC__DEFAULT__IDLE_TIMEOUT=300s
      - EMQX_LISTENERS__QUIC__DEFAULT__KEEP_ALIVE_INTERVAL=120s
      # QUIC flow control: поднимаем дефолтные msquic-окна, чтобы single subscriber
      # успевал принимать burst от 10× publishers при крупных payload без сваливания
      # в conn_congestion. CONN_RECV_WINDOW_DEFAULT убран — EMQX 5.8 не знает этого
      # поля (unknown_env_vars в логе старта), на connection-level окно влиять
      # через env нельзя; per-stream окна × число потоков работают как cap.
      - EMQX_LISTENERS__QUIC__DEFAULT__STREAM_RECV_WINDOW_DEFAULT=1048576
      - EMQX_LISTENERS__QUIC__DEFAULT__PEER_BIDI_STREAM_COUNT=64
      - EMQX_LISTENERS__QUIC__DEFAULT__PEER_UNIDI_STREAM_COUNT=8
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_MQTT__MAX_INFLIGHT=1024
      - EMQX_MQTT__MAX_MQUEUE_LEN=80000
      - EMQX_MQTT__MQUEUE_STORE_QOS0=false
      - EMQX_FORCE_SHUTDOWN__ENABLE=true
      - EMQX_FORCE_SHUTDOWN__MAX_MAILBOX_SIZE=300000
      - EMQX_FORCE_SHUTDOWN__MAX_HEAP_SIZE=1800MB
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - mqtt
    cap_add:
      - NET_ADMIN

  metrics-server-mqtt-quic:
    build:
      context: .
      dockerfile: quic.Dockerfile
    mem_limit: 2600m
    memswap_limit: 2600m
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx1024m -XX:MaxDirectMemorySize=1280m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
    ports:
      - "8083:8083"
    cap_add:
      - NET_ADMIN
    networks:
      - mqtt
    depends_on:
      - emqx

  clickhouse:
    profiles:
      - storage
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_config/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./clickhouse_config/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./clickhouse_init:/docker-entrypoint-initdb.d
    networks:
      - mqtt

networks:
  mqtt:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
